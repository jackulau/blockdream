# Operator-build: requires JDK 21. See README.md.
# Versions track Fabric for Minecraft 1.21.x — bump as needed.
org.gradle.jvmargs=-Xmx2G
# Toolchain hint: where to find JDK 21 when it is not on java_home's radar
# (Homebrew `openjdk@21` is keg-only on macOS). Nonexistent paths are ignored.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home,/usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.105.0+1.21.1
mod_version=0.1.0
maven_group=world.blockdream
archives_base_name=blockdream-mapwall
