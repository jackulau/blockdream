plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Live world-model bridge: a plain WebSocket client. `include` jar-in-jars it so the
    // built mod is self-contained. (Gson ships with Minecraft; ImageIO is in the JDK.)
    include implementation('org.java-websocket:Java-WebSocket:1.5.7')
}

java {
    // Toolchain: compile with a real JDK 21 even if Gradle itself runs on an older JVM
    // (e.g. macOS `/usr/libexec/java_home -v 21` silently falls back when 21 is brew-only).
    // Detection hint for the Homebrew install lives in gradle.properties.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
