  - paragraph [ref=e14]: Everything here runs locally and open-source. The world models generate every frame with a recursive transformer (KV-cached, served over a tiny WebSocket); the block-art engine quantizes to the real Minecraft map palette with OKLab color matching and dithering. Built end-to-end — data, training, serving, and these testers.
  - generic [ref=e15]:
    - heading "01Live neural world models" [level=2] [ref=e16]
    - paragraph [ref=e17]: Each frame is generated by the model from the previous frame + your control — no game engine underneath. The canvas redraws at your screen's refresh rate (display fps), decoupled from how fast the model generates (gen fps), so it's always smooth. Auto-connects to the local servers.
