<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a7'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23fff'/%3E%3C/svg%3E" />
    <title>blockdream · block-art tester</title>
    <meta name="author" content="Jack Lau" />
    <meta name="description" content="Blockdream block-art tester by Jack Lau - preview how any image maps to the Minecraft map palette with OKLab color matching and dithering, with per-block hover info and a bill of materials." />
    <meta property="og:title" content="blockdream · block-art tester" />
    <meta property="og:description" content="Image → Minecraft block-art with OKLab color matching, dithering, per-block hover info and a bill of materials. By Jack Lau." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/jackulau/blockdream" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #121315;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header { padding: 1rem 1.25rem; border-bottom: 1px solid #2a2c30; }
      header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.2px; }
      header p { margin: 0.25rem 0 0; color: #9aa0a6; font-size: 0.85rem; }
      main { display: flex; gap: 1.25rem; padding: 1.25rem; flex-wrap: wrap; }
      .controls { display: flex; flex-direction: column; gap: 0.75rem; min-width: 220px; }
      .controls label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: #b8bcc2; }
      .controls select, .controls input[type="range"], .controls input[type="file"] { width: 100%; }
      .canvases { display: flex; gap: 1.25rem; flex-wrap: wrap; }
      figure { margin: 0; }
      figcaption { font-size: 0.75rem; color: #9aa0a6; margin-top: 0.4rem; }
      canvas { image-rendering: pixelated; border: 1px solid #2a2c30; background: #0b0c0d; max-width: 512px; }
      .stat { font-size: 0.8rem; color: #9aa0a6; }
      code { color: #7dd3fc; }
      #out { cursor: crosshair; }
      .tooltip {
        position: fixed; pointer-events: none; z-index: 50; display: none;
        background: #0b0c0dee; border: 1px solid #3a3d42; border-radius: 6px;
        padding: 0.4rem 0.55rem; font: 12px ui-monospace, monospace; color: #e6e6e6;
        box-shadow: 0 6px 20px #000a;
      }
      .tooltip .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #0008; vertical-align: -2px; margin-right: 6px; image-rendering: pixelated; }
      .tooltip .id { color: #7dd3fc; }
      .materials { min-width: 260px; max-width: 340px; }
      .materials h2 { font-size: 0.9rem; margin: 0 0 0.5rem; }
      .materials label.tex { font-size: 0.75rem; color: #9aa0a6; display: flex; gap: 0.35rem; align-items: center; margin-bottom: 0.5rem; }
      .bom { list-style: none; margin: 0; padding: 0; max-height: 560px; overflow: auto; }
      .bom li { display: grid; grid-template-columns: 28px 1fr auto; gap: 0.5rem; align-items: center; padding: 0.25rem 0.3rem; border-radius: 5px; }
      .bom li:nth-child(odd) { background: #ffffff08; }
      .bom .ic { width: 26px; height: 26px; image-rendering: pixelated; border: 1px solid #0006; border-radius: 3px; }
      .bom .nm { font-size: 0.82rem; line-height: 1.2; }
      .bom .nm small { color: #7dd3fc; font: 11px ui-monospace, monospace; }
      .bom .ct { text-align: right; font: 12px ui-monospace, monospace; color: #cfd3d8; }
      .bom .ct small { display: block; color: #9aa0a6; }
    </style>
  </head>
  <body>
    <header>
      <h1>blockdream · block-art tester</h1>
      <a href="/index.html" style="color:#7dd3fc;font-size:.85rem;text-decoration:none">← home</a> <a href="/world-model.html" style="color:#7dd3fc;font-size:.85rem;text-decoration:none">world-model tester →</a>
      <p>Drop an image to preview how it maps to the Minecraft map palette (OKLab + dithering). The full GIF/video → datapack/.mcstructure pipeline lives in the <code>blockdream</code> CLI.</p>
    </header>
    <main>
      <section class="controls">
        <label>Image
          <input id="file" type="file" accept="image/*" />
        </label>
        <label>Grid width
          <input id="grid" type="range" min="16" max="256" step="16" value="128" />
          <span id="gridVal" class="stat">128 px</span>
        </label>
        <label>Dither
          <select id="dither">
            <option value="floyd-steinberg">Floyd–Steinberg</option>
            <option value="bayer">Bayer (ordered)</option>
            <option value="none">None (nearest)</option>
          </select>
        </label>
        <label>Palette
          <select id="palette">
            <option value="map">Map colors (244)</option>
          </select>
        </label>
        <div id="stats" class="stat"></div>
      </section>
      <section class="canvases">
        <figure><canvas id="src" width="256" height="256"></canvas><figcaption>source</figcaption></figure>
        <figure><canvas id="out" width="256" height="256"></canvas><figcaption>block-art · hover to identify a block</figcaption></figure>
      </section>
      <section class="materials">
        <h2>Blocks used</h2>
        <ul id="bom" class="bom"></ul>
      </section>
    </main>
    <footer style="margin-top:auto;padding:1rem 1.25rem;border-top:1px solid #2a2c30;color:#9aa0a6;font-size:.8rem">
      by <strong>Jack Lau</strong> · <a href="https://github.com/jackulau/blockdream" target="_blank" rel="noopener" style="color:#7dd3fc">GitHub</a> · <a href="https://www.linkedin.com/in/-jacklau/" target="_blank" rel="noopener" style="color:#7dd3fc">LinkedIn</a>
    </footer>
    <div id="tooltip" class="tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
