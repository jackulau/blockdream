[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockdream-wm"
version = "0.0.0"
description = "blockdream - neural Minecraft world model (server AR + browser latent-diffusion)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "onnx>=1.16", "websockets>=12.0"]
serve = ["websockets>=12.0"]
export = ["onnx>=1.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/blockdream_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: CPU-heavy decoder/WM-inference tests - excluded by verify-all fast mode (BLOCKDREAM_FAST=1 runs pytest -m 'not slow')",
]
